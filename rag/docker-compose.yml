version: "3.9"

services:
  rag-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mplads-rag-backend
    ports:
      - "8001:8001"
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - chroma_data:/app/data/chroma_db
      - upload_data:/app/data/uploads

  postgres:
    image: pgvector/pgvector:pg17
    container_name: mplads-postgres
    environment:
      POSTGRES_DB: mplads_rag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mplads_rag"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  chroma_data:
  upload_data:
