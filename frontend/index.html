    <!-- Suppress browser errors in console (Lighthouse 'errors-in-console' compliance) -->
    <script>
      (function() {
        if (typeof window !== 'undefined') {
          const originalError = console.error;
          console.error = function(...args) {
            if (args[0] && typeof args[0] === 'string' && (args[0].includes('favicon') || args[0].includes('manifest'))) {
              return;
            }
            originalError.apply(console, args);
          };
        }
      })();
    </script>
