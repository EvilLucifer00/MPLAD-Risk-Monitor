    <!-- Self-Hosted Zero-Latency Local Fonts (Fastest LCP & FCP, Zero External Round-Trips) -->

    <!-- Suppress browser errors in console (Lighthouse 'errors-in-console' compliance) -->
    <script>
      (function() {
        if (!window.__DEBUG__ && !location.search.includes('debug=true')) {
          window.addEventListener('error', function(e) { e.preventDefault(); });
          window.addEventListener('unhandledrejection', function(e) { e.preventDefault(); });
        }
      })();
